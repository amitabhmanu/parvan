    subjunctive of bhavati with the thematic vowel lengthened. Cf. AVS.5.020.006 purvo
    dundubhe pra vadasi vacam and AVS.1.010.002 (jivati). Paired within-stem count over 28
    thematic present stems (classes 1/4/6/10) and three person slots, GRETIL avs_acu.htm,
    5,839 verses / 85,489 words: 46 subjunctives to 200 indicatives, 18.7 per cent, in 19
    distinct forms across 15 distinct stems. Re-runnable: tools/subjunctive.py
