id: e.163
type: attests
from: anc.asokan-brahmi
to: ref.writing-practice
method: epigraphic-citation
provenance:
  tier: asserted
  source: >
    CII I, Inscriptions of Asoka. Rock and pillar edicts published across the subcontinent
    presuppose scribes, materials and a reading public, so writing is in ordinary use by the
    mid-third century BCE at the latest.
